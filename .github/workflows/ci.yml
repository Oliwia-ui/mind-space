name: Native Swift CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  test-and-bundle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Run unit tests
        run: ./scripts/test.sh
      - name: Build native app bundle
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict "dist/Mind Space.app"
